{% extends 'base.html' %}

{% block title %}Change Password | Autospace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 min-h-[calc(100vh-16rem)] flex flex-col justify-center">
  <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-xl">
    <h1 class="text-2xl font-bold font-playfair text-gray-900 mb-2">Change Password</h1>
    <p class="text-xs text-gray-500 mb-6">Update your account password below.</p>
    
    {% if success %}
      <div class="p-4 mb-4 text-sm font-semibold text-green-800 bg-green-50 border border-green-200 rounded-lg flex items-center gap-2">
        <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        Password changed successfully!
      </div>
    {% endif %}

    {% if error %}
      <div class="p-3 mb-4 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-md">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="" class="space-y-4" x-data="{ loading: false }" @submit="loading = true">
      {% csrf_token %}
      
      <!-- CURRENT PASSWORD -->
      <label class="text-sm block select-none" x-data="{ show: false }">
        <div class="mb-1 font-semibold text-gray-700">Current Password</div>
        <div class="relative">
          <input
            :type="show ? 'text' : 'password'"
            name="oldPassword"
            required
            placeholder="••••••••"
            class="block w-full px-3 py-2 pr-10 border border-gray-300 rounded appearance-none placeholder-gray-400 text-black focus:outline-none focus:ring-2 focus:ring-yellow focus:border-yellow sm:text-sm transition-all"
          />
          <button type="button" @click="show = !show" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-black p-1 focus:outline-none">
            <svg x-show="!show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <svg x-show="show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"></path></svg>
          </button>
        </div>
      </label>

      <!-- NEW PASSWORD -->
      <label class="text-sm block select-none" x-data="{ show: false }">
        <div class="mb-1 font-semibold text-gray-700">New Password</div>
        <div class="relative">
          <input
            :type="show ? 'text' : 'password'"
            name="newPassword"
            required
            placeholder="••••••••"
            class="block w-full px-3 py-2 pr-10 border border-gray-300 rounded appearance-none placeholder-gray-400 text-black focus:outline-none focus:ring-2 focus:ring-yellow focus:border-yellow sm:text-sm transition-all"
          />
          <button type="button" @click="show = !show" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-black p-1 focus:outline-none">
            <svg x-show="!show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <svg x-show="show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"></path></svg>
          </button>
        </div>
      </label>

      <!-- CONFIRM NEW PASSWORD -->
      <label class="text-sm block select-none" x-data="{ show: false }">
        <div class="mb-1 font-semibold text-gray-700">Confirm New Password</div>
        <div class="relative">
          <input
            :type="show ? 'text' : 'password'"
            name="confirmNewPassword"
            required
            placeholder="••••••••"
            class="block w-full px-3 py-2 pr-10 border border-gray-300 rounded appearance-none placeholder-gray-400 text-black focus:outline-none focus:ring-2 focus:ring-yellow focus:border-yellow sm:text-sm transition-all"
          />
          <button type="button" @click="show = !show" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-black p-1 focus:outline-none">
            <svg x-show="!show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            <svg x-show="show" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 014.122-.963c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"></path></svg>
          </button>
        </div>
      </label>

      <button
        type="submit"
        :disabled="loading"
        :class="loading ? 'opacity-80 cursor-not-allowed' : 'hover:bg-yellow-400'"
        class="relative rounded font-medium px-4 py-2.5 text-sm w-full text-black bg-yellow border-2 border-yellow font-bold transition-all shadow-md mt-2 flex items-center justify-center"
      >
        <template x-if="loading">
          <div class="absolute inset-0 flex items-center justify-center">
            <svg class="w-5 h-5 animate-spin text-black" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
        </template>
        <span :class="loading ? 'opacity-10' : 'opacity-100'">Update Password</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
