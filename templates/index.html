{% extends 'base.html' %}
{% load static %}

{% block title %}Autospace - Need parking?{% endblock %}

{% block content %}
<main class="relative h-[calc(100vh-4rem)] overflow-hidden">
  <!-- 3D CAR SCENE CONTAINER -->
  <div class="absolute inset-0 p-2">
    <div id="car-scene-container" class="w-full h-full shadow-lg shadow-black/40 rounded-lg overflow-hidden relative" style="background: linear-gradient(to top right, hsl(0, 0%, 15%), hsl(52, 0%, 30%));">
      <canvas id="car-scene-canvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

      <!-- FLOATING FRUSTRATED COMMENT PROJECTED DIRECTLY ABOVE THE YELLOW CAR -->
      <div id="car-frustrated-comment" class="absolute top-0 left-0 z-20 text-[12px] text-gray-300 pointer-events-none select-none text-left whitespace-pre font-mono max-w-sm drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">
        Need parking space or I'm starting a carpool on the roof.
      </div>
    </div>
  </div>

  <!-- FLOATING HERO OVERLAY TEXT & SEARCH LINK -->
  <div class="container relative mx-auto p-4 sm:p-8 pt-8 z-10 flex flex-col items-start space-y-2 font-black text-6xl sm:text-8xl select-none pointer-events-none">
    <div class="z-10 inline-block px-3 py-1 bg-yellow text-black pointer-events-auto shadow-md">
      Need
    </div>
    <div class="z-10 inline-block w-full max-w-md px-3 py-1 bg-yellow text-black pointer-events-auto shadow-md">
      parking?
    </div>
    <a href="/search" class="z-10 flex items-center gap-2 px-4 py-2 text-xl font-medium text-black underline underline-offset-4 bg-primary hover:bg-yellow-400 transition-colors pointer-events-auto shadow-lg mt-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      Search now
    </a>
  </div>
</main>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/car-scene.js' %}"></script>
{% endblock %}
